data:
  augment:
    bias_coeff: 0.5
    gibbs_alpha: [0.0, 0.8]
    gmm_mu_jitter: 0.05
    gmm_prob_real: 0.8
    gmm_sigma_jitter: 0.1
    noise_std: 0.08
    scale_factor: 0.6
    shift_offset: 2.0
    smooth_sigma: [0.3, 1.0]
  cache_dir: .monai_cache/fastsurfer3d
  num_samples: 8
  patch_size: null
  spatial_size: [192, 192, 192]
data_root: ./data
method: fastsurfervinn
model: {input_nc: 1, num_filters: 64, num_filters_interpol: 64, output_nc: 35, type: fastsurfervinn}
train: {batch_size: 16, ce_weight: 0.5, class_weight_volumes: 1000, dice_weight: 0.5,
  display_freq: 50, ema_decay: 0.999,
  epochs: 350, early_stop_patience: 0, early_stop_min_epochs: 100, ignore_index: -1,
  lr: 0.0001, lr_policy: cosine, max_grad_norm: 1.0, mixed_precision: bf16, num_workers: 8,
  output_dir: runs/fastsurfervinn, save_every: 5, use_ema: true, val_every: 1, warmup_epochs: 10,
  weight_decay: 1.0e-05, voxel_weight: true, edge_w: 5.0}
train_datasets:
- modalities: [T1w]
  name: openBHB
  seg_dir: fastsurfer_seg
- modalities: [FLAIR]
  name: ADNI4
  seg_dir: fastsurfer_seg
- modalities: [FLAIR]
  name: ADNI3
  seg_dir: fastsurfer_seg
- modalities: [T1w, T2w]
  name: HCPA
  seg_dir: fastsurfer_seg
- modalities: [T1w, T2w]
  name: HCPD
  seg_dir: fastsurfer_seg
- modalities: [T1w, T2w]
  name: HCPY
  seg_dir: fastsurfer_seg
val_datasets:
- modalities: [T1w]
  name: openBHB
  seg_dir: fastsurfer_seg
- modalities: [FLAIR]
  name: ADNI4
  seg_dir: fastsurfer_seg
- modalities: [FLAIR]
  name: ADNI3
  seg_dir: fastsurfer_seg
- modalities: [T1w, T2w]
  name: HCPA
  seg_dir: fastsurfer_seg
- modalities: [T1w, T2w]
  name: HCPD
  seg_dir: fastsurfer_seg
- modalities: [T1w, T2w]
  name: HCPY
  seg_dir: fastsurfer_seg
