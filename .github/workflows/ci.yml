name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Verify checkpoint checksums
        run: sha256sum --check checkpoints/SHA256SUMS

      - name: Install PyTorch for CPU
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Build and install the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install "$RUNNER_TEMP"/wheels/*.whl
          python -m pip check

      - name: Test the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python -m fastsurfer_vinn.inference --help
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
